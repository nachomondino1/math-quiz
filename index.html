<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Quizzes cortos de repaso de matemática, con gráficos y explicaciones.">
<meta name="theme-color" content="#f4f7fb">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
<title>Quizzes de repaso</title>
</head>
<body>
<div id="app"><h1>Quizzes de repaso</h1><p class="tip">Cargando…</p></div>
<script>
(async () => {
  const app = document.getElementById("app");
  const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const since = ts => {
    const d = Math.floor((Date.now() - ts) / 86400000);
    return d <= 0 ? "hoy" : d === 1 ? "ayer" : `hace ${d} días`;
  };
  const attempt = id => {
    try {
      const raw = localStorage.getItem("mq:" + id);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  };
  try {
    const man = await (await fetch("quizzes/manifest.json", { cache: "no-cache" })).json();
    const card = q => {
      const a = attempt(q.id);
      const badge = a ? `<span class="chip">${a.good}/${a.total} · ${since(a.ts)}</span>` : "";
      return `<a class="item" href="quiz.html?q=${encodeURIComponent(q.id)}"><div class="fe">${esc(q.fecha || "")}</div><div class="ti">${esc(q.titulo)} ${badge}</div><div class="de">${esc(q.descripcion || "")}</div></a>`;
    };
    const sel = new URLSearchParams(location.search).get("c");
    app.innerHTML = "<h1>Quizzes de repaso</h1><p class='tip'>Elegí un tema y después un quiz.</p>" + man.carpetas.map((c, i) => {
      const qs = man.quizzes.filter(q => q.carpeta === c.id);
      const n = qs.length ? `${qs.length} quiz${qs.length > 1 ? "zes" : ""}` : "Próximamente";
      const abierta = sel ? sel === c.id : i === 0;
      return `<details class="folder t${i % 5}"${abierta && qs.length ? " open" : ""}><summary><span class="fi-ic" aria-hidden="true"></span><span class="ft"><b>${esc(c.titulo)}</b><small>${esc(c.descripcion || "")}</small></span><span class="chip t${i % 5}">${n}</span></summary>${qs.map(card).join("")}</details>`;
    }).join("");
  } catch (e) {
    app.innerHTML = "<h1>Quizzes de repaso</h1><p>No pude cargar la lista.</p>";
  }
})();
</script>
</body>
</html>
